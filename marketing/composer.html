<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkinWise UI demo composer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; position: relative; }

  #bg { position: absolute; inset: 0;
    background:
      radial-gradient(110% 62% at 50% 106%, rgba(14,104,184,.55) 0%, rgba(14,104,184,0) 62%),
      linear-gradient(180deg, #02070d 0%, #03111e 55%, #04192b 100%); }

  #bg, #caps, #end { pointer-events: none; }

  /* captions */
  #caps { position: absolute; left: 0; right: 0; top: 104px; height: 250px; }
  .cap { position: absolute; inset: 0; text-align: center; opacity: 0; will-change: opacity, transform; }
  .cap h1 { font-size: 76px; line-height: 1.04; font-weight: 600; letter-spacing: -.048em; }
  .cap p { margin-top: 20px; font-size: 34px; line-height: 1.25; color: #9db3c8; font-weight: 400; letter-spacing: -.01em; }

  /* phone */
  #stage { position: absolute; inset: 0; }
  #phone { position: absolute; width: 706.6px; height: 1496.56px; left: 186.7px; top: 372px; border-radius: 102px; background: #0d0e10;
    box-shadow: 0 0 0 2px #2c2f35, 0 0 0 4px #121316, 0 70px 140px rgba(0,0,0,.6), 0 0 90px rgba(18,110,190,.18); }
  #phone::before, #phone::after { content: ""; position: absolute; width: 6px; border-radius: 4px; background: #23262b; }
  #phone::before { left: -7px; top: 300px; height: 120px; box-shadow: 0 150px 0 #23262b, 0 -90px 0 #23262b; }
  #phone::after { right: -7px; top: 380px; height: 190px; }
  #screen { position: absolute; left: 14px; top: 14px; width: 390px; height: 844px; transform-origin: 0 0; transform: scale(1.74); border-radius: 50px; overflow: hidden; background: #000; }
  #status { position: absolute; left: 0; right: 0; top: 0; height: 44px; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; transition: none; }
  #status .time { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  #status .island { position: absolute; left: 50%; top: 11px; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; }
  #status svg { display: block; }
  #app { position: absolute; left: 0; top: 44px; width: 390px; height: 778px; border: 0; background: #000; z-index: 1; }
  #home { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; z-index: 3; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  #home b { width: 134px; height: 5px; border-radius: 3px; }

  /* finger */
  #touch { position: absolute; left: 0; top: 0; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; z-index: 5; pointer-events: none; opacity: 0;
    background: rgba(255,255,255,.34); border: 2.5px solid rgba(255,255,255,.95); box-shadow: 0 0 0 7px rgba(255,255,255,.12), 0 8px 26px rgba(0,0,0,.5); }
  #ripple { position: absolute; left: 0; top: 0; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; z-index: 4; pointer-events: none; opacity: 0; border: 2px solid rgba(255,255,255,.8); }

  /* end card */
  #end { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px; }
  #end .wordmark { font-size: 60px; font-weight: 700; letter-spacing: -.03em; color: #7cc0f5; }
  #end h2 { margin-top: 56px; font-size: 92px; line-height: 1.03; font-weight: 600; letter-spacing: -.05em; }
  #end .cta { margin-top: 64px; display: inline-flex; align-items: center; gap: 18px; height: 112px; padding: 0 60px; border-radius: 22px; background: linear-gradient(105deg, #00558f, #0079bd); color: #fff; font-size: 42px; font-weight: 650; letter-spacing: -.02em; box-shadow: 0 18px 50px rgba(0,121,189,.35); }
  #end .fine { position: absolute; left: 80px; right: 80px; bottom: 90px; font-size: 31px; line-height: 1.38; color: #9db0c2; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="caps"></div>
  <div id="stage">
    <div id="phone">
      <div id="screen">
        <div id="status">
          <span class="time">9:41</span>
          <i class="island"></i>
          <span class="sys">
            <svg width="66" height="14" viewBox="0 0 66 14" fill="currentColor" aria-hidden="true">
              <rect x="0" y="9" width="3.2" height="5" rx="1"/><rect x="5" y="6.5" width="3.2" height="7.5" rx="1"/><rect x="10" y="3.5" width="3.2" height="10.5" rx="1"/><rect x="15" y="0" width="3.2" height="14" rx="1"/>
              <path d="M28 4.2c2.5-2.4 6.2-2.4 8.7 0l-1.3 1.4c-1.8-1.7-4.4-1.7-6.2 0z M30.4 7.1c1.2-1.1 3-1.1 4.2 0l-1.2 1.4c-.5-.4-1.3-.4-1.8 0z"/><circle cx="32.5" cy="10.8" r="1.3"/>
              <rect x="44" y="1.5" width="19" height="11" rx="3.2" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1.1"/><rect x="45.6" y="3.1" width="15" height="7.8" rx="1.8"/><rect x="63.8" y="5" width="1.6" height="4" rx=".8" fill-opacity=".5"/>
            </svg>
          </span>
        </div>
        <iframe id="app" title="App" scrolling="yes"></iframe>
        <div id="home"><b></b></div>
        <div id="ripple"></div>
        <div id="touch"></div>
      </div>
    </div>
  </div>
  <div id="end">
    <div class="wordmark">AI-SKINWISE</div>
    <h2>Less wondering.<br>More understanding.</h2>
    <div class="cta">Start a skin check <span class="arr">&#8599;</span></div>
    <p class="fine">Sample data shown. AI-SKINWISE provides general information, not a medical diagnosis.</p>
  </div>

<script>
  const Q = new URLSearchParams(location.search);
  const APP = Q.get("app");
  document.getElementById("app").src = APP + "/";

  const S = 1.74, PHONE_L = 186.7, PHONE_T = 372, BEZEL = 14;
  const SCREEN_X = PHONE_L + BEZEL, SCREEN_Y = PHONE_T + BEZEL;
  const $ = (id) => document.getElementById(id);
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const easeInOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const lerp = (a, b, k) => a + (b - a) * k;

  window.__cfg = { caps: [], camera: [{ t: 0, s: 1, fx: 195, fy: 380 }], endAt: 1e9, touches: [] };
  window.__touches = [];

  function buildCaps() {
    const host = $("caps"); host.innerHTML = "";
    window.__cfg.caps.forEach((c) => {
      const d = document.createElement("div"); d.className = "cap";
      d.innerHTML = "<h1>" + c.title.replace(/\n/g, "<br>") + "</h1>" + (c.sub ? "<p>" + c.sub + "</p>" : "");
      host.appendChild(d); c.el = d;
    });
  }
  window.__setCfg = (cfg) => { window.__cfg = Object.assign(window.__cfg, cfg); buildCaps(); };
  window.__addTouch = (tc) => { window.__touches.push(tc); window.__touches.sort((a, b) => a.t0 - b.t0); };

  function parseRGBA(s) {
    const m = String(s).match(/rgba?\(([^)]+)\)/); if (!m) return [0, 0, 0, 1];
    const p = m[1].split(/[ ,\/]+/).filter(Boolean).map(parseFloat); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
  }
  function flatten(fg, bg) { const a = fg[3]; return [0, 1, 2].map((i) => Math.round(fg[i] * a + bg[i] * (1 - a))); }
  const lum = (c) => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;

  // Everything visual is a pure function of t (seconds) so frames are exactly reproducible.
  window.__render = (t, info) => {
    const cfg = window.__cfg;

    // status bar + home indicator colours follow the app
    if (info) {
      const body = parseRGBA(info.bodyBg); const bodyC = [body[0], body[1], body[2]];
      const top = flatten(parseRGBA(info.topBg), bodyC);
      const fgTop = lum(top) > .55 ? "#0b0b0b" : "#ffffff";
      const fgBot = lum(bodyC) > .55 ? "#0b0b0b" : "#ffffff";
      $("status").style.background = "rgb(" + top.join(",") + ")"; $("status").style.color = fgTop;
      $("home").style.background = "rgb(" + bodyC.join(",") + ")"; $("home").querySelector("b").style.background = fgBot;
      $("app").style.background = "rgb(" + bodyC.join(",") + ")";
    }

    // captions
    cfg.caps.forEach((c) => {
      const inK = easeOut(clamp01((t - c.t0) / 0.6));
      const outK = easeInOut(clamp01((t - (c.t1 - 0.4)) / 0.4));
      const vis = c.t0 <= t && t <= c.t1;
      const op = vis ? inK * (1 - outK) : 0;
      c.el.style.opacity = op.toFixed(3);
      const y = (1 - inK) * 26 - outK * 12;
      c.el.style.transform = "translateY(" + y.toFixed(2) + "px)";
      c.el.style.filter = op > 0 && inK < 1 ? "blur(" + ((1 - inK) * 7).toFixed(2) + "px)" : "none";
    });

    // camera: scale about a focus point (screen coordinates), keyframes eased
    const ks = cfg.camera; let a = ks[0], b = ks[0];
    for (let i = 0; i < ks.length; i++) { if (ks[i].t <= t) a = ks[i]; if (ks[i].t > t) { b = ks[i]; break; } b = ks[i]; }
    const k = b.t > a.t ? easeInOut(clamp01((t - a.t) / (b.t - a.t))) : 1;
    const s = lerp(a.s, b.s, k), fx = lerp(a.fx, b.fx, k), fy = lerp(a.fy, b.fy, k);
    $("stage").style.transformOrigin = (SCREEN_X + fx * S) + "px " + (SCREEN_Y + fy * S) + "px";
    const endK = easeInOut(clamp01((t - cfg.endAt) / 0.7));
    $("stage").style.transform = "scale(" + (s * (1 - 0.05 * endK)).toFixed(4) + ")";
    $("stage").style.opacity = (1 - endK).toFixed(3);
    $("caps").style.opacity = (1 - clamp01((t - cfg.endAt) / 0.4)).toFixed(3);

    // end card
    const eIn = easeOut(clamp01((t - cfg.endAt - 0.35) / 0.8));
    $("end").style.opacity = eIn.toFixed(3);
    $("end").style.transform = "translateY(" + ((1 - eIn) * 30).toFixed(2) + "px)";

    // finger (taps and drags)
    const T = window.__touches; let cur = -1;
    for (let i = 0; i < T.length; i++) if (T[i].t0 <= t) cur = i;
    const touch = $("touch"), ripple = $("ripple");
    if (cur < 0) { touch.style.opacity = 0; ripple.style.opacity = 0; return; }
    const tc = T[cur], prev = T[cur - 1], next = T[cur + 1];
    const endOf = (o) => (o.drag ? { x: o.x2, y: o.y2 } : { x: o.x, y: o.y });
    const from = prev ? endOf(prev) : { x: tc.x + 70, y: tc.y + 150 };
    let x, y, pressed;
    if (tc.drag) {
      const approach = easeInOut(clamp01((t - tc.t0) / (tc.tm - tc.t0)));
      const drag = easeInOut(clamp01((t - tc.tm) / (tc.t1 - tc.tm)));
      x = t < tc.tm ? lerp(from.x, tc.x, approach) : lerp(tc.x, tc.x2, drag);
      y = t < tc.tm ? lerp(from.y, tc.y, approach) : lerp(tc.y, tc.y2, drag);
      pressed = t >= tc.tm && t <= tc.tr;
    } else {
      const mk = easeInOut(clamp01((t - tc.t0) / (tc.t1 - tc.t0)));
      x = lerp(from.x, tc.x, mk); y = lerp(from.y, tc.y, mk);
      pressed = t >= tc.t1 && t <= tc.tr;
    }
    const idleAfter = tc.tr + 0.3;
    const fadeOut = next && next.t0 - idleAfter < 1.0 ? 0 : easeInOut(clamp01((t - idleAfter) / 0.35));
    const fadeIn = clamp01((t - tc.t0) / 0.25);
    touch.style.opacity = (fadeIn * (1 - fadeOut)).toFixed(3);
    touch.style.transform = "translate(" + x.toFixed(2) + "px," + (y + 44).toFixed(2) + "px) scale(" + (pressed ? 0.8 : 1) + ")";
    if (tc.drag) { ripple.style.opacity = 0; return; }
    const rk = clamp01((t - tc.t1) / 0.55);
    ripple.style.opacity = rk > 0 && rk < 1 ? (0.55 * (1 - rk)).toFixed(3) : 0;
    ripple.style.transform = "translate(" + tc.x.toFixed(2) + "px," + (tc.y + 44).toFixed(2) + "px) scale(" + (0.6 + 1.9 * easeOut(rk)).toFixed(3) + ")";
  };

  // iframe rect in page coordinates (after camera transform), for mapping real input events
  window.__appRect = () => { const r = $("app").getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height }; };
  window.__ready = true;
</script>
</body>
</html>
